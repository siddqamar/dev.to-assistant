[project]
name = "dev-to-assistant"
version = "0.1.0"
description = "Internal tool to review fellow builders posting without drowning"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "google-genai>=2.7.0",
    "gradio>=6.15.2",
    "pandas>=3.0.3",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
